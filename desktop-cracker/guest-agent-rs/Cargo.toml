[package]
name = "guest-agent-rs"
description = "The guest's own agent, in Rust: the screen (with the damage logic), the shares, the sound, the network, the shutdown channel and the run's own files"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Rodrigo Antonio <rodjjo@gmail.com>"]
# A workspace of its own on purpose: these binaries are built for the **guest** (a static musl
# build, so the guest needs nothing of the host's libc), while the application and its libraries
# are built for the host.  Keeping them apart is what stops a guest dependency from reaching the
# application's own build.
[workspace]

[lib]
name = "guest_agent_rs"
path = "src/lib.rs"

[dependencies]
# **The display channel's own framer**, shared with the host: the guest writes its messages with
# the very code the host parses them with (`dc-fc-display::stream`), so the two cannot drift.
dc-fc-display = { path = "../internal_libs/dc-fc-display" }
libc = "0.2"

[features]
# The **sound** needs ALSA's own client library (`snd-aloop` is an ALSA card, and its PCM is not
# reachable through OSS emulation).  It links `libasound` at run time, with `dlopen`, so a guest
# with no ALSA still runs: it is a feature because a *static* guest build cannot have it.
default = []
sound = []

[[bin]]
name = "desk-agent"
path = "src/bin/desk-agent.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
